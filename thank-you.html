<style>
:root{
  --ink:#15140F;--paper:#F2EEE3;--signal:#B3401C;
  --signal-deep:#8A3013;--muted:#6E6656;--line-dark:#3a3527;--white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--paper);
  background:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;text-align:center;
}
.card{max-width:520px}
.badge{
  width:64px;height:64px;border-radius:0;
  background:var(--signal);color:var(--white);border:1px solid var(--signal);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;margin:0 auto 28px;
  animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--signal);display:inline-flex;align-items:center;gap:.7em;
}
.eyebrow::before{content:"//";color:#8a8168}
h1{
  font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;
  font-size:clamp(2rem,5vw,2.6rem);letter-spacing:-.02em;
  margin:16px 0 14px;line-height:1.1;color:var(--white);
}
h1 .accent{color:var(--signal)}
p{color:#c2b9a3;font-size:1.02rem;max-width:40ch;margin:0 auto 32px}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-weight:600;font-size:.9rem;padding:13px 22px;border-radius:0;
  background:var(--signal);color:var(--white);border:1px solid var(--signal);cursor:pointer;
  transition:background .15s,border-color .15s;text-decoration:none;
}
.btn:hover{background:var(--signal-deep);border-color:var(--signal-deep)}
.small{margin-top:22px;font-size:.84rem;color:#8a8168}
.small a{color:#c2b9a3}
@media(prefers-reduced-motion:reduce){.badge{animation:none}}
.site-footer{
  position:fixed;bottom:0;left:0;right:0;
  padding:18px;text-align:center;font-size:.8rem;color:#8a8168;
  border-top:1px solid var(--line-dark);font-family:'IBM Plex Mono',monospace;
}
.site-footer a{color:#8a8168;text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><i class="fas fa-check"></i></div>
    <span class="eyebrow">Message sent</span>
    <h1>Thanks, it's <span class="accent">on its way.</span></h1>
    <p>Your message has landed in my inbox. I read everything and will get back to you as soon as I can.</p>
    <a href="/" class="btn"><i class="fas fa-arrow-left"></i> Back to the site</a>
    <p class="small">In the meantime, find me on <a href="https://linkedin.com/in/godfred-prebbie-mensah" target="_blank" rel="noopener">LinkedIn</a>.</p>
  </div>
  <footer class="site-footer">
    &copy; <span id="yr"></span> Godfred Prebbie Mensah &middot; <a href="/privacy.html">Privacy Policy</a>
  </footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
